services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: logs
      POSTGRES_USER: logger
      POSTGRES_PASSWORD: logger
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - jit=off
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logger -d logs"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://logger:logger@postgres:5432/logs
      SYNC_COMMIT: "off"
      # Signs the opaque pagination cursor. Fixed here so cursors stay valid
      # across a container restart; unset, the process generates a random secret
      # at startup and cursors minted before a restart are rejected.
      CURSOR_SECRET: local-development-cursor-key
      # Attribute keys that get a dedicated partial ordered index. Empty ships
      # none; see README "Indexes" for the measured write cost. Every indexed
      # key costs a JSONB extraction and a scattered B-tree write on every
      # ingested row, so a key is only worth indexing if reads actually filter
      # on it.
      HOT_ATTRIBUTE_KEYS: ""
      RETENTION_DAYS: "30"
      # Reject logs older than this many days at ingest, rather than accepting
      # them and deleting them on the next retention pass. Refusing is the more
      # honest answer, but it is a change to the ingest contract -- a client
      # backfilling history gets a per-entry rejection where it used to get a
      # 200 -- so it is opt-in and off by default. 0 disables the check.
      MAX_LOG_AGE_DAYS: "${MAX_LOG_AGE_DAYS:-0}"
      WRITE_POOL_SIZE: "2"
      QUERY_POOL_SIZE: "8"
      # Attribute filters are index-backed (see migration 002), so this is a
      # backstop rather than load-bearing. It stays below the code default
      # because a `q` substring search is still a scan, and one of those should
      # not be able to hold a backend for ten seconds.
      QUERY_STATEMENT_TIMEOUT_MS: "5000"
      BATCH_DELAY_MS: "5"
      QUEUE_MAX_ROWS: "50000"
      # No heap flag. --max-old-space-size is a V8 option and this image runs
      # Bun, whose heap is JavaScriptCore's; there is no equivalent hard cap.
      # mem_limit below is therefore the only ceiling, which makes peak RSS the
      # number to watch — measured at 91-106 MiB on ingest and 147 MiB on the
      # drain path, against the 256m limit. If Bun is ever OOM-killed here,
      # `bun --smol run src/index.ts` is the documented next step.
      NODE_OPTIONS: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      # The bun image ships no node binary; same probe, bun's runtime.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 3s
      timeout: 2s
      retries: 30
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
